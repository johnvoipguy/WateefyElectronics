name: Bug Report
description: Report a reproducible problem with hardware behavior or documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - NODE Mini V1a
        - NODE Backbone V1a
        - NODE Flex V1a
        - Other / Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Firmware / Revision
      placeholder: "e.g., WLED 0.15.0-b4, docs rev 3.0"
    validations:
      required: false

  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      placeholder: "Clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / captures
      description: Serial logs, screenshots, photos, measurements, etc.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I included enough detail to reproduce
          required: true