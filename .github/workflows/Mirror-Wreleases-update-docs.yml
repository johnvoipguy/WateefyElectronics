name: Mirror WLED releases + Firmware README index

on:
  workflow_dispatch:
    inputs:
      max_releases:
        description: "Max matching source releases to process"
        required: true
        default: "50"
      title_regex:
        description: "Case-insensitive regex for source release title"
        required: true
        default: "(xiao|waveshare)"

permissions:
  contents: write

jobs:
  mirror-and-Firmware-docs:
    runs-on: ubuntu-latest
    env:
      SRC_OWNER: johnvoipguy
      SRC_REPO: wled-custom-builds
      DST_OWNER: johnvoipguy
      DST_REPO: WateefyElectronics
      MAX_RELEASES: ${{ github.event.inputs.max_releases }}
      TITLE_REGEX: ${{ github.event.inputs.title_regex }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror releases/assets and update Firmware README files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const srcOwner = process.env.SRC_OWNER;
            const srcRepo = process.env.SRC_REPO;
            const dstOwner = process.env.DST_OWNER;
            const dstRepo = process.env.DST_REPO;
            const maxReleases = Number(process.env.MAX_RELEASES || "50");
            const titleRegex = new RegExp(process.env.TITLE_REGEX || "(xiao|waveshare)", "i");
            const normalize = (s) => (s || "").trim().toLowerCase();

            core.info(`Source: ${srcOwner}/${srcRepo}`);
            core.info(`Destination: ${dstOwner}/${dstRepo}`);
            core.info(`Regex: ${titleRegex}`);
            core.info(`Max releases: ${maxReleases}`);

            // Verify destination repo access
            await github.rest.repos.get({ owner: dstOwner, repo: dstRepo });

            // Pull source releases
            const sourceReleases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: srcOwner, repo: srcRepo, per_page: 100 }
            );

            const candidates = sourceReleases
              .filter(r => !r.draft)
              .filter(r => titleRegex.test(r.name || ""))
              .slice(0, maxReleases);

            core.info(`Matched source releases: ${candidates.length}`);
            if (candidates.length === 0) {
              core.warning("No source releases matched the title regex.");
            }

            // Mirror releases and assets
            for (const src of candidates) {
              const srcTag = src.tag_name;
              const dstTag = `mirror-${srcTag}`;
              const dstName = `${src.name || srcTag} (mirrored)`;
              const body = [
                `Mirrored from **${srcOwner}/${srcRepo}**`,
                ``,
                `- Source release: ${src.html_url}`,
                `- Source tag: \`${srcTag}\``,
                ``,
                `---`,
                ``,
                src.body || "_No source release notes provided._"
              ].join("\n");

              core.info(`Processing: ${src.name || srcTag} -> ${dstTag}`);

              let dstRelease;
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: dstOwner,
                  repo: dstRepo,
                  tag: dstTag
                });

                dstRelease = await github.rest.repos.updateRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: existing.data.id,
                  name: dstName,
                  body,
                  draft: false,
                  prerelease: src.prerelease
                });
                core.info(`Updated release ${dstTag}`);
              } catch (e) {
                if (e.status !== 404) throw e;

                dstRelease = await github.rest.repos.createRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  tag_name: dstTag,
                  name: dstName,
                  body,
                  draft: false,
                  prerelease: src.prerelease
                });
                core.info(`Created release ${dstTag}`);
              }

              const releaseId = dstRelease.data.id;

              // De-dupe assets by normalized filename
              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: dstOwner, repo: dstRepo, release_id: releaseId, per_page: 100 }
              );
              const existingNames = new Set(existingAssets.map(a => normalize(a.name)));

              core.info(`Source assets: ${src.assets.length}`);
              for (const a of src.assets) {
                const normalized = normalize(a.name);
                if (existingNames.has(normalized)) {
                  core.info(`Skip existing asset: ${a.name}`);
                  continue;
                }

                core.info(`Downloading: ${a.name}`);
                const res = await fetch(a.browser_download_url, {
                  headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
                });

                if (!res.ok) {
                  core.warning(`Download failed for ${a.name}: HTTP ${res.status}`);
                  continue;
                }

                const data = Buffer.from(await res.arrayBuffer());
                if (!data.length) {
                  core.warning(`Downloaded empty asset: ${a.name}`);
                  continue;
                }

                core.info(`Uploading: ${a.name} (${data.length} bytes)`);
                await github.rest.repos.uploadReleaseAsset({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: releaseId,
                  name: a.name,
                  data
                });

                existingNames.add(normalized);
              }
            }

            // Build categorized lists from mirrored destination releases
            const mirrored = (await github.paginate(
              github.rest.repos.listReleases,
              { owner: dstOwner, repo: dstRepo, per_page: 100 }
            )).filter(r => !r.draft && (r.tag_name || "").startsWith("mirror-"));

            const mini = mirrored.filter(r =>
              /(xiao|seeed-xiao)/i.test(r.name || "") || /(xiao|seeed-xiao)/i.test(r.tag_name || "")
            );

            const backbone = mirrored.filter(r =>
              /(waveshare)/i.test(r.name || "") || /(waveshare)/i.test(r.tag_name || "")
            );

            const pixel = mirrored.filter(r =>
              /(xiao|seeed-xiao|waveshare|pixel)/i.test(r.name || "") ||
              /(xiao|seeed-xiao|waveshare|pixel)/i.test(r.tag_name || "")
            );

            const list = (arr, n = 30) =>
              arr.slice(0, n).map(r => `- [${r.name || r.tag_name}](${r.html_url})`).join("\n") || "- _None yet_";
            const latest = (arr) =>
              arr[0] ? `- [${arr[0].name || arr[0].tag_name}](${arr[0].html_url})` : "- _None yet_";

            async function upsertFile(path, content, message) {
              let sha;
              try {
                const existing = await github.rest.repos.getContent({ owner: dstOwner, repo: dstRepo, path });
                sha = existing.data.sha;
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner: dstOwner,
                repo: dstRepo,
                path,
                message,
                content: Buffer.from(content).toString("base64"),
                sha
              });
              core.info(`Upserted ${path}`);
            }

            const FirmwareReadme = `# Firmware Downloads

            Choose your hardware family:

            - [LED Pixel Controllers](./LED%20Pixel%20Controllers/README.md)
            - [Node Mini](./Node%20Mini/README.md)
            - [Node Backbone](./Node%20Backbone/README.md)

            All mirrored releases:
            https://github.com/${dstOwner}/${dstRepo}/releases
            `;

            const miniReadme = `# Node Mini Firmware (XIAO)

            Latest:
            ${latest(mini)}

            Recent builds:
            ${list(mini, 30)}

            All releases:
            https://github.com/${dstOwner}/${dstRepo}/releases
            `;

            const backboneReadme = `# Node Backbone Firmware (Waveshare)

            Latest:
            ${latest(backbone)}

            Recent builds:
            ${list(backbone, 30)}

            All releases:
            https://github.com/${dstOwner}/${dstRepo}/releases
            `;

            const pixelReadme = `# LED Pixel Controller Firmware (XIAO / Waveshare)

            Recommended families:
            - Node Mini (XIAO): [open](../Node%20Mini/README.md)
            - Node Backbone (Waveshare): [open](../Node%20Backbone/README.md)

            Latest XIAO:
            ${latest(mini)}

            Latest Waveshare:
            ${latest(backbone)}

            Recent related builds:
            ${list(pixel, 30)}
            `;

            await upsertFile("Firmware/README.md", FirmwareReadme, "docs: update Firmware index");
            await upsertFile("Firmware/Node Mini/README.md", miniReadme, "docs: update Node Mini Firmware links");
            await upsertFile("Firmware/Node Backbone/README.md", backboneReadme, "docs: update Node Backbone Firmware links");
            await upsertFile("Firmware/LED Pixel Controllers/README.md", pixelReadme, "docs: update LED Pixel Controllers Firmware links");

            core.info("Done.");
