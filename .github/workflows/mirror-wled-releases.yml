name: Mirror releases (xiao/waveshare)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SRC_OWNER: johnvoipguy
      SRC_REPO: wled-custom-builds
      DST_OWNER: johnvoipguy
      DST_REPO: WateefyElectronics
      TITLE_REGEX: (xiao|waveshare)
      MAX_RELEASES: "50"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const regex = new RegExp(process.env.TITLE_REGEX, 'i');
            const max = Number(process.env.MAX_RELEASES || '50');

            const srcOwner = process.env.SRC_OWNER;
            const srcRepo = process.env.SRC_REPO;
            const dstOwner = process.env.DST_OWNER;
            const dstRepo = process.env.DST_REPO;

            core.info(`Source: ${srcOwner}/${srcRepo}`);
            core.info(`Dest:   ${dstOwner}/${dstRepo}`);

            // 1) Verify destination repo access
            await github.rest.repos.get({ owner: dstOwner, repo: dstRepo });

            // 2) Pull source releases
            const all = await github.paginate(
              github.rest.repos.listReleases,
              { owner: srcOwner, repo: srcRepo, per_page: 100 }
            );

            const matches = all
              .filter(r => !r.draft)
              .filter(r => regex.test(r.name || ''))
              .slice(0, max);

            core.info(`Matched releases: ${matches.length}`);
            if (matches.length === 0) {
              core.warning('No matching releases found. Check TITLE_REGEX and source release names.');
              return;
            }

            for (const r of matches) {
              const srcTag = r.tag_name;
              const dstTag = `mirror-${srcTag}`;
              const dstName = `${r.name || srcTag} (mirrored)`;

              core.info(`Processing: ${r.name} -> ${dstTag}`);

              let rel;
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: dstOwner, repo: dstRepo, tag: dstTag
                });

                rel = await github.rest.repos.updateRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: existing.data.id,
                  name: dstName,
                  body: `Mirrored from ${r.html_url}\n\n${r.body || ''}`,
                  draft: false,
                  prerelease: r.prerelease
                });
                core.info(`Updated release ${dstTag}`);
              } catch (e) {
                if (e.status !== 404) throw e;

                rel = await github.rest.repos.createRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  tag_name: dstTag,
                  name: dstName,
                  body: `Mirrored from ${r.html_url}\n\n${r.body || ''}`,
                  draft: false,
                  prerelease: r.prerelease
                });
                core.info(`Created release ${dstTag}`);
              }

              const releaseId = rel.data.id;

              // existing assets in destination
              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: dstOwner, repo: dstRepo, release_id: releaseId, per_page: 100 }
              );
              const existingNames = new Set(existingAssets.map(a => a.name));

              core.info(`Source assets: ${r.assets.length}`);
              for (const a of r.assets) {
                if (existingNames.has(a.name)) {
                  core.info(`Skip existing asset: ${a.name}`);
                  continue;
                }

                core.info(`Download: ${a.name}`);
                const res = await fetch(a.browser_download_url, {
                  headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` }
                });
                if (!res.ok) {
                  core.warning(`Failed download ${a.name}: HTTP ${res.status}`);
                  continue;
                }

                const buf = Buffer.from(await res.arrayBuffer());
                if (!buf.length) {
                  core.warning(`Empty file: ${a.name}`);
                  continue;
                }

                core.info(`Upload: ${a.name} (${buf.length} bytes)`);
                await github.rest.repos.uploadReleaseAsset({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: releaseId,
                  name: a.name,
                  data: buf
                });
              }
            }

            core.info('Mirror complete');
