name: Mirror selected releases from wled-custom-builds

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Source repo in owner/name format"
        required: true
        default: "johnvoipguy/wled-custom-builds"
      title_regex:
        description: "Case-insensitive regex applied to release title"
        required: true
        default: "(xiao|waveshare)"
      max_releases:
        description: "Max number of source releases to process this run"
        required: true
        default: "30"
      overwrite_existing:
        description: "If true, delete/recreate destination release when tag exists"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror releases
        uses: actions/github-script@v7
        env:
          SOURCE_REPO: ${{ github.event.inputs.source_repo }}
          TITLE_REGEX: ${{ github.event.inputs.title_regex }}
          MAX_RELEASES: ${{ github.event.inputs.max_releases }}
          OVERWRITE_EXISTING: ${{ github.event.inputs.overwrite_existing }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const [srcOwner, srcRepo] = process.env.SOURCE_REPO.split('/');
            const dstOwner = context.repo.owner;
            const dstRepo = context.repo.repo;
            const titleRegex = new RegExp(process.env.TITLE_REGEX, 'i');
            const maxReleases = Number(process.env.MAX_RELEASES || '30');
            const overwriteExisting = String(process.env.OVERWRITE_EXISTING) === 'true';

            if (!srcOwner || !srcRepo) {
              core.setFailed(`Invalid SOURCE_REPO: ${process.env.SOURCE_REPO}`);
              return;
            }

            core.info(`Source: ${srcOwner}/${srcRepo}`);
            core.info(`Destination: ${dstOwner}/${dstRepo}`);
            core.info(`Title filter regex: ${titleRegex}`);
            core.info(`Max releases: ${maxReleases}`);
            core.info(`Overwrite existing: ${overwriteExisting}`);

            // Fetch source releases (latest first)
            const srcReleases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: srcOwner, repo: srcRepo, per_page: 100 }
            );

            const candidates = srcReleases
              .filter(r => !r.draft) // skip drafts
              .filter(r => titleRegex.test(r.name || ''))
              .slice(0, maxReleases);

            core.info(`Found ${candidates.length} matching source releases`);

            for (const srcRel of candidates) {
              const srcTag = srcRel.tag_name;
              const dstTag = `mirror-${srcTag}`;
              const dstName = srcRel.name
                ? `${srcRel.name} (mirrored)`
                : `Mirrored ${srcTag}`;

              core.info(`\n--- Processing source release: ${srcRel.name} (${srcTag}) -> ${dstTag}`);

              // Compose destination body with provenance
              const sourceUrl = srcRel.html_url;
              const sourceRepoUrl = `https://github.com/${srcOwner}/${srcRepo}/releases`;
              const body = [
                `Mirrored from **${srcOwner}/${srcRepo}**`,
                ``,
                `- Source release: ${sourceUrl}`,
                `- Source releases list: ${sourceRepoUrl}`,
                `- Source tag: \`${srcTag}\``,
                ``,
                `---`,
                ``,
                srcRel.body || '_No source release notes provided._'
              ].join('\n');

              // Check if destination release already exists by tag
              let existing = null;
              try {
                existing = await github.rest.repos.getReleaseByTag({
                  owner: dstOwner,
                  repo: dstRepo,
                  tag: dstTag
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              if (existing && overwriteExisting) {
                core.info(`Destination release ${dstTag} exists. Deleting (overwrite enabled)...`);
                await github.rest.repos.deleteRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: existing.data.id
                });

                // Best-effort delete ref so tag can be recreated
                try {
                  await github.rest.git.deleteRef({
                    owner: dstOwner,
                    repo: dstRepo,
                    ref: `tags/${dstTag}`
                  });
                } catch (e) {
                  core.warning(`Could not delete existing tag refs/tags/${dstTag}: ${e.message}`);
                }

                existing = null;
              }

              // Create or update destination release
              let dstRelease;
              if (!existing) {
                dstRelease = await github.rest.repos.createRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  tag_name: dstTag,
                  name: dstName,
                  body,
                  draft: false,
                  prerelease: srcRel.prerelease,
                  target_commitish: context.sha
                });
                core.info(`Created destination release ${dstTag}`);
              } else {
                dstRelease = await github.rest.repos.updateRelease({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: existing.data.id,
                  name: dstName,
                  body,
                  draft: false,
                  prerelease: srcRel.prerelease
                });
                core.info(`Updated destination release ${dstTag}`);
              }

              const tmpDir = path.join(process.env.RUNNER_TEMP || '/tmp', `mirror-${Date.now()}-${Math.random().toString(16).slice(2)}`);
              fs.mkdirSync(tmpDir, { recursive: true });

              // If updating without overwrite, avoid duplicate asset names by collecting existing names
              let existingAssetNames = new Set();
              if (existing && !overwriteExisting) {
                const assets = await github.paginate(
                  github.rest.repos.listReleaseAssets,
                  { owner: dstOwner, repo: dstRepo, release_id: dstRelease.data.id, per_page: 100 }
                );
                existingAssetNames = new Set(assets.map(a => a.name));
              }

              for (const asset of srcRel.assets) {
                const assetName = asset.name;
                if (existingAssetNames.has(assetName)) {
                  core.info(`Skipping existing asset: ${assetName}`);
                  continue;
                }

                core.info(`Downloading asset: ${assetName}`);
                const downloadResp = await github.request(asset.url, {
                  headers: {
                    accept: 'application/octet-stream'
                  }
                });

                const filePath = path.join(tmpDir, assetName);
                fs.writeFileSync(filePath, Buffer.from(downloadResp.data));

                const stat = fs.statSync(filePath);
                const data = fs.readFileSync(filePath);

                core.info(`Uploading asset: ${assetName} (${stat.size} bytes)`);
                await github.rest.repos.uploadReleaseAsset({
                  owner: dstOwner,
                  repo: dstRepo,
                  release_id: dstRelease.data.id,
                  name: assetName,
                  data,
                  headers: {
                    'content-type': asset.content_type || 'application/octet-stream',
                    'content-length': stat.size
                  }
                });
              }

              core.info(`Done: ${dstRelease.data.html_url}`);
            }

            core.info('\nMirroring run completed.');
